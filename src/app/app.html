<svg class="svg-filtros" aria-hidden="true">
  <filter id="vidrio" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="ruido"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="ruido" scale="20" xChannelSelector="R" yChannelSelector="G" result="deformado"></feDisplacementMap>
    <feFlood flood-color="#0f1117" result="solido"></feFlood>
    <feMerge>
      <feMergeNode in="solido"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
      <feMergeNode in="deformado"></feMergeNode>
    </feMerge>
  </filter>
</svg>
